name: sentra-mi8
services:
  sentra-mi8:
    # Builds the Sentra Mi8 Next.js standalone image from this checkout.
    image: sentra-mi8:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentra-mi8
    # Host port is configurable via SENTRA_MI8_PORT in .env (defaults to 3000).
    # Deprecated compatibility alias: OSIRIS_PORT.
    ports:
      - "${SENTRA_MI8_PORT:-${OSIRIS_PORT:-3000}}:3000"
    # Optional API keys / scanner backend — copy .env.template to .env and
    # fill in what you need. Missing file is ignored (keyless feeds still work).
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      default:
        aliases:
          - osiris
      umami_default:

  sentra-mi8-cache:
    image: nginx:alpine
    container_name: sentra-mi8-cache
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      - sentra-mi8
    restart: unless-stopped
    networks:
      default:

  sentra-mi8-intel:
    build:
      context: ./intel
      dockerfile: Dockerfile
    container_name: sentra-mi8-intel
    ports:
      - "4000:4000"
    restart: unless-stopped
    networks:
      default:
        aliases:
          - osiris-intel

volumes:
  nginx-cache:

networks:
  umami_default:
    external: true

# ── CasaOS app-store metadata (ignored by plain Docker Compose) ──
x-casaos:
  architectures:
    - amd64
    - arm64
  main: sentra-mi8
  author: aidenmi8
  developer: aidenmi8
  category: Network
  description:
    en_us: >-
      Sentra Mi8 is a production-grade open-source OSINT situational-awareness
      dashboard. It aggregates real-time global intelligence across aviation,
      maritime, CCTV networks, seismic activity, wildfires, news feeds,
      weather, space weather, cyber threats (CVEs) and conflict zones into a
      single GPU-accelerated MapLibre interface. Most features work with no
      API keys.
  tagline:
    en_us: Real-time global OSINT intelligence dashboard
  title:
    en_us: Sentra Mi8
  icon: https://raw.githubusercontent.com/aidenmi8/sentra-Y/master/public/casaos-icon.png
  thumbnail: https://raw.githubusercontent.com/aidenmi8/sentra-Y/master/public/og-image.png
  screenshot_link:
    - https://raw.githubusercontent.com/aidenmi8/sentra-Y/master/public/og-image.png
  scheme: http
  hostname: ""
  port_map: "3000"
  index: /
  webui_port: 3000
  envs:
    - container: GEMINI_API_KEY_1
      description:
        en_us: "(Optional) Gemini API key for AI analyst and briefing routes. Add GEMINI_API_KEY_2..8 in .env for rotation."
    - container: AIS_API_KEY
      description:
        en_us: "(Optional) aisstream.io key for live maritime vessel tracking."
    - container: SCANNER_URL
      description:
        en_us: "(Optional) RECON scanner backend URL, e.g. http://scanner:7700"
    - container: SCANNER_KEY
      description:
        en_us: "(Optional) RECON scanner shared secret (must match backend SENTRA_MI8_KEY; deprecated OSIRIS_KEY alias may still work during migration)."
    - container: SDK_INGEST_KEY
      description:
        en_us: "(Optional) Shared write key required for /api/sdk/ingest."
    - container: GITHUB_WEBHOOK_SECRET
      description:
        en_us: "(Optional) GitHub webhook HMAC secret."
    - container: GITHUB_WEBHOOK_FORWARD_URL
      description:
        en_us: "(Optional) Internal bridge URL that /api/github-webhook forwards to."
    - container: UMAMI_ENDPOINT
      description:
        en_us: "(Optional) Umami /api/send endpoint. Analytics are disabled if unset."
    - container: UMAMI_WEBSITE_ID
      description:
        en_us: "(Optional) Umami website id. Analytics are disabled if unset."
    - container: SENTRA_MI8_INTEL_URL
      description:
        en_us: "(Optional) Override for the Sentra Mi8 intel service URL."
    - container: SENTRA_MI8_TELEGRAM_CHANNELS
      description:
        en_us: "(Optional) Comma-separated public Telegram preview channel usernames."
    - container: IPTV_ORG_BASE_URL
      description:
        en_us: "(Optional) IPTV-org-compatible country playlist/API source override."
    - container: FIRMS_API_KEY
      description:
        en_us: "(Planned/reserved) NASA FIRMS keyed API; current route uses public FIRMS CSV."
    - container: OPENSKY_CLIENT_ID
      description:
        en_us: "(Planned/reserved) OpenSky OAuth2 client id; current route uses keyless adsb.lol."
    - container: OPENSKY_CLIENT_SECRET
      description:
        en_us: "(Planned/reserved) OpenSky OAuth2 client secret."
    - container: N2YO_API_KEY
      description:
        en_us: "(Planned/reserved) N2YO key; current route uses public TLE sources."
  ports:
    - container: "3000"
      description:
        en_us: "Web UI (HTTP)."
